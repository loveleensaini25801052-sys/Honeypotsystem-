<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Administrator Login | Honeypot System</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-user-shield"></i>
        </div>

        <h1>Cyber SOC Console</h1>
        <p>Honeypot Monitoring & Intelligence System</p>

        {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="Administrator Username" required autocomplete="off">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-key"></i>
                <input type="password" name="password" placeholder="Passcode" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Authenticate & Connect
            </button>
        </form>

        <div class="account-link">
            Need an administrator account? <a href="{{ url_for('register') }}">Register Here</a>
        </div>

        <div class="status-footer">
            <i class="fa-solid fa-lock"></i> Encrypted Administrator Access
        </div>
    </div>
</div>

</body>
</html>
