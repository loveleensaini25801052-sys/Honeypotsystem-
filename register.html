<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Administrator Account | Honeypot System</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="login-container">
    <div class="login-card">
        <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h1>Create SOC Account</h1>
        <p>Register New System Administrator</p>

        {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" name="username" placeholder="Choose Admin Username" required autocomplete="off">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-key"></i>
                <input type="password" name="password" placeholder="Set Secure Password" required>
            </div>

            <button type="submit" class="register-btn">
                <i class="fa-solid fa-id-card"></i> Register Account
            </button>
        </form>

        <div class="account-link">
            Already registered? <a href="{{ url_for('login') }}">Sign In Here</a>
        </div>

        <div class="status-footer">
            <i class="fa-solid fa-shield-halved"></i> Honeypot Security Management
        </div>
    </div>
</div>

</body>
</html>
